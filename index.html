<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Trabalho Final Computação Grafica</title>
		<link href="https://fonts.googleapis.com/css?family=Noto+Sans|Roboto+Mono&display=swap" rel="stylesheet">
		<link  rel="stylesheet" type="text/css" href="libs/css/main.css" >
		<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
		<script src="https://aframe.io/releases/0.9.2/aframe.min.js"></script>
		<script src="https://raw.githack.com/jeromeetienne/AR.js/2.0.8/aframe/build/aframe-ar.js"></script>

		<style>
			body { margin: 0; }
			canvas { width: 100%; height: 100% }
		</style> 
	</head>
	<body style='margin : 0px; overflow: hidden;'>
		
			<a-scene embedded arjs>
					<a-marker preset="hiro">
						<a-sphere color="white" radius="0.5" position="0 1 0"></a-sphere>
						<a-sphere color="red" radius="0.5" position="0 1 -0.5"></a-sphere>
						<a-sphere color="green" radius="0.5" position="0 1 -1"></a-sphere>

						<a-sphere color="black" radius="0.5" position="0.2 2 -1"></a-sphere>
						<a-sphere color="black" radius="0.5" position="-0.2 2 -1"></a-sphere>

						<a-cone color="orange" radius-bottom="0.4" radius-top="0" height="1" position="0 1 -1"></a-cone>

						  <a-cylinder color="black" height="1" radius="0.2" rotation="0 0 -45" position="-1 1 -0.5"></a-cylinder>
						   <a-cylinder color="black" height="1" radius="0.2" rotation="0 0 45" position="1 1 -0.5"></a-cylinder>
					</a-marker>
					<a-entity camera></a-entity>
			</a-scene>
	</body>
</html>
